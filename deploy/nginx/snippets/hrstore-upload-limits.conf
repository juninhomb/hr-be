# HR Store — limites para upload multi-imagem (admin inventário).
# Incluir dentro do bloco server { } do api.hrstorept.com:
#   include /etc/nginx/snippets/hrstore-upload-limits.conf;

# Multer: até 12 × 5 MB ≈ 60 MB + overhead multipart → 80 MB.
client_max_body_size 80M;

# Uploads grandes: não cortar à meio do body.
client_body_timeout 120s;
client_body_buffer_size 128k;

# Proxy para Node (porta 3001 por defeito).
proxy_connect_timeout 60s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

# Opcional: evita buffer em disco para bodies enormes (ajusta se tiveres pouco RAM).
# proxy_request_buffering off;
