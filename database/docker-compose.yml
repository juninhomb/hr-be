# Postgres local para testar schema / queries SQL (ex.: n8n_bot_v2_queries.sql).
#
# Arranque:
#   cd hrstore-backend/database && docker compose up -d
#
# psql interactivo:
#   docker compose exec postgres psql -U hrstore -d evolution_db
#
# Aplicar ou reaplicar schema (sem apagar volume):
#   docker compose exec -T postgres psql -U hrstore -d evolution_db < schema.sql
#
# Ligação (host): localhost:5433  — porta 5433 evita conflito com Postgres já a correr.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrstore-postgres-dev
    environment:
      POSTGRES_USER: hrstore
      POSTGRES_PASSWORD: hrstore
      POSTGRES_DB: evolution_db
    ports:
      - '5433:5432'
    volumes:
      - hrstore_pgdata:/var/lib/postgresql/data
      # Só corre na primeira inicialização do volume vazio:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  hrstore_pgdata:
